name: $bog_ui

permissions: write-all

on:
  workflow_dispatch:
  push:
  pull_request:
  schedule:
  - cron: "0 7 * * *"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

    - uses: hyoo-ru/mam_build@master2
      with:
        package: 'bog'
        modules: 'ui/app demo effects'

    - uses: b-on-g/mol-prerender-action@main
      with:
        folder: 'bog/ui/app/-'
        base-url: 'https://b-on-g.github.io/bog/'
        route-key: 'component'
        screens: |
          badge
          empty
          skeleton
          breadcrumb
          sidebar
          sheet
          toast
          command
          table

    - uses: hyoo-ru/gh-deploy@v4.4.1
      if: github.ref == 'refs/heads/master'
      with:
        folder: 'bog/ui/app/-'
    
    - uses: hyoo-ru/gh-deploy@v4.4.1
      if: github.ref == 'refs/heads/master'
      with:
        folder: 'bog/demo/-'
        target-folder: 'demo'

    - uses: hyoo-ru/gh-deploy@v4.4.1
      if: github.ref == 'refs/heads/master'
      with:
        folder: 'bog/effects/-'
        target-folder: 'effects'
